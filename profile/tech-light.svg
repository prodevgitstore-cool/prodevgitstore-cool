<svg xmlns="http://www.w3.org/2000/svg" width="960" height="196" viewBox="0 0 960 196" role="img" aria-label="Technology stack: Python, Django, Node.js, REST APIs, React, JavaScript, TypeScript, PostgreSQL, AWS, Git, GitHub">
  <defs>
    <clipPath id="tech-card">
      <rect width="960" height="196" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tech-card)">
    <rect width="960" height="196" fill="#f8fafc"/>
    <g>
      <text x="28" y="52" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Backend</text>
      <rect x="150" y="30" width="108" height="32" rx="16" fill="#3776AB"/>
      <text x="204" y="51" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Python</text>
      <rect x="268" y="30" width="108" height="32" rx="16" fill="#064e3b"/>
      <text x="322" y="51" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Django</text>
      <rect x="386" y="30" width="118" height="32" rx="16" fill="#166534"/>
      <text x="445" y="51" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Node.js</text>
      <rect x="514" y="30" width="124" height="32" rx="16" fill="#334155"/>
      <text x="576" y="51" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">REST APIs</text>
    </g>
    <g>
      <text x="28" y="106" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Frontend</text>
      <rect x="150" y="84" width="100" height="32" rx="16" fill="#0e7490"/>
      <text x="200" y="105" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">React</text>
      <rect x="260" y="84" width="132" height="32" rx="16" fill="#F7DF1E"/>
      <text x="326" y="105" text-anchor="middle" fill="#111827" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">JavaScript</text>
      <rect x="402" y="84" width="132" height="32" rx="16" fill="#3178C6"/>
      <text x="468" y="105" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">TypeScript</text>
    </g>
    <g>
      <text x="28" y="160" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Delivery</text>
      <rect x="150" y="138" width="132" height="32" rx="16" fill="#4169E1"/>
      <text x="216" y="159" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">PostgreSQL</text>
      <rect x="292" y="138" width="80" height="32" rx="16" fill="#232F3E"/>
      <text x="332" y="159" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">AWS</text>
      <rect x="382" y="138" width="72" height="32" rx="16" fill="#F05032"/>
      <text x="418" y="159" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Git</text>
      <rect x="464" y="138" width="100" height="32" rx="16" fill="#181717"/>
      <text x="514" y="159" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">GitHub</text>
    </g>
    <rect y="0" width="140" height="196" fill="#ffffff" opacity="0.45">
      <animate attributeName="x" values="-160;960" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="959" height="195" rx="12" fill="none" stroke="#cbd5e1">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
