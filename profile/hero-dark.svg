<svg xmlns="http://www.w3.org/2000/svg" width="960" height="188" viewBox="0 0 960 188" role="img" aria-label="Python and Django developer, full-stack developer">
  <defs>
    <clipPath id="hero-card">
      <rect width="960" height="188" rx="12"/>
    </clipPath>
    <linearGradient id="hero-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#99f6e4" stop-opacity="1"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#hero-card)">
    <rect width="960" height="188" fill="#0b1220"/>
    <circle r="110" fill="#115e59" opacity="0.45">
      <animate attributeName="cx" values="-20;780;-20" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="10;160;10" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" fill="#1e3a5f" opacity="0.8">
      <animate attributeName="cx" values="980;160;980" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;-10;200" dur="14s" repeatCount="indefinite"/>
    </circle>
    <rect y="0" width="240" height="3" fill="url(#hero-sheen)">
      <animate attributeName="x" values="-240;960" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <text x="480" y="74" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2">PYTHON / DJANGO</text>
      <text x="480" y="112" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30">Full-Stack Developer</text>
      <text x="480" y="146" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Production web applications, APIs, and backend systems</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="959" height="187" rx="12" fill="none" stroke="#1e293b"/>
</svg>
