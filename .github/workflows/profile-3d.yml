# Generates a 3D GitHub contribution calendar and commits the SVG files.
#
# Action: https://github.com/yoshi389111/github-profile-3d-contrib
# Pinned to v0.9.3 so a future release cannot change the job unexpectedly.
# The upstream README also documents the moving tag @latest.
#
# Username: not hardcoded. USERNAME is ${{ github.repository_owner }}.
# In the profile repository prodevgitstore-cool/prodevgitstore-cool, that owner is you.
#
# The action reads the contribution calendar and writes SVGs into
# profile-3d-contrib/. README.md currently shows:
#   profile-3d-contrib/profile-green-animate.svg  (light, animated)
#   profile-3d-contrib/profile-night-green.svg    (dark)
#
# The same run also writes these, which you can swap into README.md:
#   profile-3d-contrib/profile-green.svg
#   profile-3d-contrib/profile-season.svg
#   profile-3d-contrib/profile-season-animate.svg
#   profile-3d-contrib/profile-south-season.svg
#   profile-3d-contrib/profile-south-season-animate.svg
#   profile-3d-contrib/profile-night-view.svg
#   profile-3d-contrib/profile-night-rainbow.svg
#   profile-3d-contrib/profile-gitblock.svg
#
# Schedule: 18:00 UTC daily (03:00 in UTC+9).
# Manual run: Actions → GitHub-Profile-3D-Contrib → Run workflow
#
# The built-in GITHUB_TOKEN is enough for the public contribution calendar.
# In GitHub: Settings → Public profile → Contributions & Activity →
# "Include private contributions on my profile" if private work should
# appear in that calendar.
# For additional private activity, create a secret whose name does not
# start with GITHUB_ (for example PROFILE_STATS_TOKEN) and switch the
# GITHUB_TOKEN line below to that secret.

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          # Full history so a later rebase still works if the statistics workflow pushed.
          fetch-depth: 0

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # The generator plays each bar once. This keeps the bars looping
      # up and down after every daily rebuild.
      - name: Loop contribution motion
        run: python3 scripts/loop_contribution_motion.py

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No contribution graph changes to commit."
            exit 0
          fi
          git commit -m "Update 3D contribution graph"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
